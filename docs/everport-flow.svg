<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="everport-flow-title everport-flow-desc" id="everport-flow-root">
        <title id="everport-flow-title">Everport request path</title>
        <desc id="everport-flow-desc">A public request reaches a Worker preview in your Cloudflare account, then a Durable Object, then travels down a WebSocket that the Everport agent opened from your computer, and the agent calls your local service. The response returns the same way. The public address stays the same after a restart.</desc>
        <defs>
      <style>#everport-flow-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #everport-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #everport-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#everport-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="everport-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="everport-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="everport-flow-arrow-accent-both" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="everport-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="224" y="40" width="336" height="120" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="324" y="44" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR CLOUDFLARE ACCOUNT</text>
        <rect x="656" y="40" width="328" height="120" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="780" y="44" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="820" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR COMPUTER</text>

        <!-- Arrows first -->
        <line x1="160" y1="104" x2="240" y2="104" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#everport-flow-arrow-link)"/>
        <line x1="360" y1="104" x2="424" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#everport-flow-arrow)"/>
        <line x1="551" y1="104" x2="672" y2="104" stroke="#bf4520" stroke-width="1.4" marker-end="url(#everport-flow-arrow-accent-both)"/>
        <polygon points="544,104 552,100.4 552,107.6" fill="#bf4520"/>
        <line x1="792" y1="104" x2="848" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#everport-flow-arrow)"/>

        <!-- Arrow labels -->
        <rect x="180" y="84" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="94" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>
        <rect x="372" y="84" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="94" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
        <rect x="580" y="84" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="608" y="94" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEBSOCKET</text>
        <rect x="804" y="84" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="820" y="94" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>

        <text x="608" y="128" fill="#bf4520" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">opened first,</text>
        <text x="608" y="142" fill="#bf4520" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">by the agent</text>
        <!-- Node: Caller -->
        <rect x="40" y="72" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="120" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="80" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="62" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="100" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Caller</text>
        <text x="100" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webhook · browser</text>
        <!-- Node: Worker preview -->
        <rect x="240" y="72" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="72" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="248" y="80" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="264" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="300" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker preview</text>
        <text x="300" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one per tunnel</text>
        <text x="300" y="152" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIXED URL · SAME AFTER A RESTART</text>
        <!-- Node: Durable Object -->
        <rect x="424" y="72" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="72" width="120" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="432" y="80" width="24" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="444" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DO</text>
        <text x="484" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Durable Object</text>
        <text x="484" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds the socket</text>
        <!-- Node: Agent -->
        <rect x="672" y="72" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="672" y="72" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="680" y="80" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="700" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="732" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
        <text x="732" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">background Node</text>
        <!-- Node: Local service -->
        <rect x="848" y="72" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="72" width="120" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="856" y="80" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="876" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
        <text x="908" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local service</text>
        <text x="908" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:3000</text>

        <!-- Legend strip -->
        <line x1="40" y1="188" x2="960" y2="188" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="220" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="228" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Holds the connection</text>
        <rect x="176" y="220" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="196" y="228" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Everport code</text>
        <rect x="296" y="220" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="316" y="228" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Caller</text>
        <rect x="376" y="220" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="396" y="228" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Your service</text>
        <line x1="500" y1="225" x2="528" y2="225" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#everport-flow-arrow-link)"/>
        <text x="536" y="228" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Public request</text>
        <line x1="660" y1="225" x2="688" y2="225" stroke="#bf4520" stroke-width="1.4" marker-end="url(#everport-flow-arrow-accent)"/>
        <text x="696" y="228" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kept open from your computer</text>
        <line x1="860" y1="225" x2="888" y2="225" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#everport-flow-arrow)"/>
        <text x="896" y="228" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Relayed call</text>
      </svg>
