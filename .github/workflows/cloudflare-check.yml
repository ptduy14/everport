name: cloudflare-check

# Manual run against a real Cloudflare account, on macOS and Ubuntu. It needs two repository secrets,
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and it creates and removes Workers named ep-smoke-*.
# The secrets are only given to the steps that talk to Cloudflare, never to npm ci or the build.
on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SMOKE_WORKER: ep-smoke-ci-${{ matrix.os == 'macos-latest' && 'mac' || 'lnx' }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A Cloudflare login is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          EVERPORT_DATA_DIR="$RUNNER_TEMP/doctor" node packages/cli/dist/everport.js doctor
      - name: Relay and whole product on Cloudflare (real agent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVERPORT_CLOUDFLARE: '1'
        run: npx vitest run --config vitest.e2e.config.ts packages/agent/src/cloudflare.e2e.test.ts packages/agent/src/everport.e2e.test.ts
      - name: Packed CLI flow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVERPORT_WORKER_NAME: ${{ env.SMOKE_WORKER }}
        run: bash scripts/smoke-cli.sh
      - name: Extension host, whole flow on Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVERPORT_E2E_CLOUDFLARE: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:vscode -w everport-vscode; else npm run test:vscode -w everport-vscode; fi
      - name: Extension host, tunnel survives VS Code exiting
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVERPORT_E2E_SURVIVE: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:vscode -w everport-vscode; else npm run test:vscode -w everport-vscode; fi
      - name: Remove the smoke Worker if a step stopped early
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: '1'
        run: npx -y wrangler@4.166.0 delete --name "$SMOKE_WORKER" --force || true
